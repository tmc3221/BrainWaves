<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainWaves Neon Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: 'Arial', sans-serif;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #0ff;
      font-size: 14px;
      text-shadow: 0 0 10px #0ff;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 5px;
      border: 1px solid #0ff;
      max-width: 400px;
    }

    #info h2 {
      margin-bottom: 5px;
      font-size: 16px;
    }

    #info p {
      margin: 3px 0;
      font-size: 12px;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 10px;
      border: 1px solid #0ff;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      color: #0ff;
      font-size: 11px;
      text-transform: uppercase;
      text-shadow: 0 0 5px #0ff;
    }

    .control-group input[type="range"] {
      width: 100px;
      accent-color: #0ff;
    }

    .control-group .value {
      color: #0ff;
      font-size: 10px;
      text-align: center;
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f00;
      font-size: 18px;
      text-align: center;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.9);
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #f00;
      display: none;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0ff;
      font-size: 24px;
      text-shadow: 0 0 20px #0ff;
      z-index: 999;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  
  <div id="info">
    <h2>🌊 BrainWaves Neon Visualizer</h2>
    <p id="status">Initializing...</p>
    <p id="fps">FPS: --</p>
    <p id="audio-status">Audio: Not connected</p>
  </div>

  <div id="controls">
    <div class="control-group">
      <label>Bloom</label>
      <input type="range" id="bloom" min="0" max="3" step="0.1" value="1.5">
      <div class="value" id="bloom-value">1.5</div>
    </div>
    <div class="control-group">
      <label>RGB Shift</label>
      <input type="range" id="rgbshift" min="0" max="0.02" step="0.001" value="0.005">
      <div class="value" id="rgbshift-value">0.005</div>
    </div>
    <div class="control-group">
      <label>Glitch</label>
      <input type="range" id="glitch" min="0" max="1" step="0.1" value="0.3">
      <div class="value" id="glitch-value">0.3</div>
    </div>
    <div class="control-group">
      <label>Kaleidoscope</label>
      <input type="range" id="kaleidoscope" min="0" max="12" step="1" value="6">
      <div class="value" id="kaleidoscope-value">6</div>
    </div>
  </div>

  <div id="error"></div>
  <div id="loading">Loading visualizer...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
  <script src="visualizer.js"></script>
</body>
</html>
